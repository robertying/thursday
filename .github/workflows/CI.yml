name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Jobs only read the repo unless they say otherwise.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      GRAPHQL_API_URL: https://api.tsinghua.app
      GRAPHQL_ADMIN_SECRET: ${{ secrets.GRAPHQL_ADMIN_SECRET }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - uses: pnpm/action-setup@v6
      - id: get-store-path
        run: echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT
      - uses: actions/cache@v6
        with:
          path: ${{ steps.get-store-path.outputs.STORE_PATH }}
          key: pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-
            pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
      - uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/.next/cache
          key: nextjs-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            nextjs-
            nextjs-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Codegen
        run: pnpm codegen
      - name: Lint
        run: pnpm lint
      - name: Build
        run: pnpm build

  # Publishes ghcr.io/<repo>/thursday as :<commit> and :latest; Watchtower on the server rolls out :latest.
  image:
    name: Build and push the image
    needs: [check]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    concurrency:
      group: image-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - name: Image name and tag
        id: meta
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}/thursday" >> "$GITHUB_OUTPUT"
          echo "rev=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          pull: true
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.rev }}
            ${{ steps.meta.outputs.image }}:latest
          labels: org.opencontainers.image.revision=${{ github.sha }}
          build-args: GRAPHQL_API_URL=https://api.tsinghua.app
          secrets: graphql_admin_secret=${{ secrets.GRAPHQL_ADMIN_SECRET }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Keeps the newest 10 commit tags; untagged leftovers of earlier pushes are deleted.
      - uses: dataaxiom/ghcr-cleanup-action@d52806a0dc70b430571a37da1fde39733ffd640f # v1.2.2
        with:
          package: ${{ github.event.repository.name }}/thursday
          keep-n-tagged: 10
          exclude-tags: latest
          delete-untagged: true
