name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Jobs only read the repo unless they say otherwise.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      GRAPHQL_API_URL: https://api.tsinghua.app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - id: get-store-path
        run: echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.get-store-path.outputs.STORE_PATH }}
          key: pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-
            pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/.next/cache
          key: nextjs-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            nextjs-
            nextjs-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install
        run: pnpm install --frozen-lockfile
      # Only codegen gets the admin secret, not install, lint or build.
      - name: Codegen
        run: pnpm codegen
        env:
          GRAPHQL_ADMIN_SECRET: ${{ secrets.GRAPHQL_ADMIN_SECRET }}
      - name: Lint
        run: pnpm lint
      - name: Build
        run: pnpm build

  # Publishes ghcr.io/<repo>/thursday as :<commit> and :latest.
  image:
    name: Build and push the image
    needs: [check]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    concurrency:
      group: image-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Image name and tag
        id: meta
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}/thursday" >> "$GITHUB_OUTPUT"
          echo "rev=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          pull: true
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.rev }}
            ${{ steps.meta.outputs.image }}:latest
          labels: org.opencontainers.image.revision=${{ github.sha }}
          build-args: GRAPHQL_API_URL=https://api.tsinghua.app
          secrets: graphql_admin_secret=${{ secrets.GRAPHQL_ADMIN_SECRET }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Keeps the newest 10 commit tags; untagged leftovers of earlier pushes are deleted.
      - uses: dataaxiom/ghcr-cleanup-action@d52806a0dc70b430571a37da1fde39733ffd640f # v1.2.2
        with:
          package: ${{ github.event.repository.name }}/thursday
          keep-n-tagged: 10
          exclude-tags: latest
          delete-untagged: true
